<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>公告欄 · Briefing Package</title>
<style>
  /* ===== 採用 briefing-package 既有設計 token，與主站一致 ===== */
  :root{
    --bg:#f4ece4;
    --surface:#ffffff;
    --brand:#8b5a2b;
    --brand-soft:#f0e7da;
    --ink:#4a3627;
    --ink-soft:#78716c;
    --ink-faint:#a8a29e;
    --line:#e7ddd0;
    --radius-card:16px;
    --radius-pill:999px;
    --shadow:0 1px 3px rgba(74,54,39,.06);
    --shadow-hover:0 6px 22px rgba(74,54,39,.10);
    --warn:#e67e22;
    --danger:#e74c3c;
    --fn:#d63b2f;      --fn-bg:#fbeae8;
    --outlook:#2f80c2; --outlook-bg:#e9f2fb;
    --teams:#8b5cc7;   --teams-bg:#f2eafb;
    --ln:#1f9d52;      --ln-bg:#e7f6ec;
    --other:#8a8079;   --other-bg:#efe9e1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .wrap{max-width:100%;margin:0;padding:6px 4px}

  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 2px 4px}
  .refresh{font-size:15px;font-weight:600;color:var(--brand);display:inline-flex;align-items:center;gap:5px;
    background:none;border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:6px 11px;flex:0 0 auto;
    transition:background .15s,color .15s,border-color .15s}
  .refresh:active{transform:scale(.96)}
  .refresh .ico{display:inline-block}
  .refresh.loading{color:var(--ink-faint);cursor:progress}
  .refresh.loading .ico{animation:spin .8s linear infinite}
  .refresh.done{color:#16a34a;border-color:#16a34a}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:12px;color:var(--ink-faint);margin:6px 2px 0}
  .status.err{color:var(--warn)}
  .status.ok{color:#16a34a}

  .search{display:flex;align-items:center;gap:6px;background:var(--surface);flex:1 1 170px;min-width:150px;
    border:1px solid var(--line);border-radius:10px;padding:6px 11px;box-shadow:var(--shadow)}
  .search svg{width:14px;height:14px;stroke:var(--ink-faint);flex:0 0 auto}
  .search input{flex:1;width:100%;background:transparent;border:0;outline:0;color:var(--ink);font-size:14px;font-family:inherit}
  .search input::placeholder{color:var(--ink-faint)}
  .filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .chip-f{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--radius-pill);
    background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:.15s;white-space:nowrap}
  .chip-f:hover{border-color:var(--brand)}
  .chip-f.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  main{margin-top:14px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-card);padding:15px 17px;margin:11px 0;cursor:pointer;
    box-shadow:var(--shadow);transition:.18s}
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .card.important{border-left:3px solid var(--warn)}
  /* 7 天內的公告高亮 */
  .card.recent{background:#fff8ec;border-color:#f0d3a8;box-shadow:0 0 0 1px #f0d3a8,var(--shadow)}
  .card.recent .date{color:var(--brand)}
  .ago,.nd-ago{font-size:11.5px;font-weight:700;color:var(--ink-faint);background:#f3ede6;border-radius:6px;padding:1px 6px;white-space:nowrap;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .card.recent .ago{color:var(--brand);background:#f6e3c8}

  .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;row-gap:6px;padding-right:20px}
  .src{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;line-height:1.4;white-space:nowrap}
  .src.fn{color:var(--fn);background:var(--fn-bg)}
  .src.outlook{color:var(--outlook);background:var(--outlook-bg)}
  .src.teams{color:var(--teams);background:var(--teams-bg)}
  .src.line{color:var(--ln);background:var(--ln-bg)}
  .src.others{color:var(--other);background:var(--other-bg)}
  .code{color:var(--brand);font-size:12px;font-weight:700;font-family:ui-monospace,"SF Mono","Courier New",monospace}
  .new{color:var(--danger);font-size:11px;font-weight:800;letter-spacing:.5px}
  .spacer{margin-left:auto}
  .fleet{color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.5px}
  .fleet.all{color:var(--ink-faint)}
  .date{color:var(--ink-faint);font-size:12.5px;font-weight:600;font-family:ui-monospace,"SF Mono","Courier New",monospace}

  .title{margin:11px 0 0;font-size:15.5px;font-weight:600;line-height:1.55;padding-right:20px}
  .chev{position:absolute;right:15px;top:15px;color:var(--ink-faint);font-size:13px;pointer-events:none}

  /* ===== 公告全螢幕閱讀（單獨開啟 notices.html 時用；嵌在首頁時由首頁顯示同樣樣式） ===== */
  .nd-lb{position:fixed;inset:0;z-index:50;background:rgba(40,28,18,.9);display:none;align-items:flex-start;justify-content:center;overflow:auto;
    padding:calc(16px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .nd-lb.open{display:flex}
  .nd-cap{color:#f4ece4;font-weight:700;font-size:.85rem;text-align:center;margin:0 0 10px}
  .nd-card{width:100%;max-width:760px;background:#fff;color:#4a3627;border-radius:14px;padding:20px 20px 18px;box-shadow:0 10px 34px rgba(0,0,0,.3);margin:auto 0}
  .nd-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .nd-meta .sp{margin-left:auto}
  .nd-src{display:inline-flex;font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
  .nd-code{color:#8b5a2b;font-size:12.5px;font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .nd-date{color:#a8a29e;font-size:13px;font-weight:600;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .nd-title{margin:14px 0 0;font-size:19px;font-weight:700;line-height:1.5}
  .nd-points{margin:16px 0 0;padding:16px 0 0;border-top:1px solid #e7ddd0;list-style:none;display:flex;flex-direction:column;gap:11px}
  .nd-points li{position:relative;padding-left:20px;font-size:16px;line-height:1.75;color:#57463a}
  .nd-points li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:#8b5a2b}
  .nd-empty{margin:16px 0 0;padding-top:16px;border-top:1px solid #e7ddd0;color:#a8a29e;font-size:15px}
  .nd-action{display:flex;gap:8px;margin:16px 0 0;padding:12px 14px;border:1px solid #f0c48a;background:#fdf3e6;border-radius:10px;color:#c2410c;font-size:15px;font-weight:700;line-height:1.55}
  .nd-foot{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12.5px;color:#a8a29e}
  .nd-foot b{color:#78716c;font-weight:600}
  .nd-close{display:block;margin:14px auto 0;padding:8px 22px;font-size:14px;font-weight:700;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:none;color:#f4ece4;cursor:pointer}
  mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}

  .empty{text-align:center;color:var(--ink-faint);padding:48px 20px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 單列工具列：來源篩選 + 縮小版搜尋欄 + 重新整理（則數/連線狀態/機隊列已依需求移除） -->
  <div class="bar">
    <div class="filters" id="srcFilters"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="搜尋…" autocomplete="off">
    </div>
    <button class="refresh" id="refresh" title="重新整理公告（Google 試算表約有 5 分鐘延遲，剛新增的公告可能要稍等）"><span class="ico">↻</span><span class="txt">重新整理</span></button>
  </div>
  <div class="status err" id="status" style="display:none"></div>

  <main id="list"></main>
</div>
<!-- 公告全螢幕閱讀（單獨開啟此頁時使用） -->
<div class="nd-lb" id="nd-lb"></div>

<script>
/* ======================================================================
   即時讀取「公告」Google 試算表（已發布到網路）
   你用表單新增公告 → 試算表更新 → 點「重新整理」即可看到
   ====================================================================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4iKWN7xdzmDkyChPvTfBCp7C2sJqznWaZR9l_1TnPFl4b2RqV3N1t8Y08dh1ssngXo7RbDOARxSsI/pub?output=csv";

// 帶「文字顏色／粗體」的資料來源：試算表綁定的 Google Apps Script（見 scripts/notices-rich-text.gs）。
// 留空 = 只讀上面的 CSV（沒有顏色）；填入部署後的網址即啟用，GAS 失敗會自動退回 CSV。
const RICH_URL = "https://script.google.com/macros/s/AKfycbzzr0DQO2og4sDBPXnhIYxYuZgcknVotsKeRyfOsKTG6cun9ICZvufkdc0AazAVtrpe/exec";

// 離線退路：每次成功讀取就存一份在本機；連不上時顯示上次成功的資料（不再顯示範例公告，避免誤認）
const CACHE_KEY = "notices-cache-v2";
function saveCache(kind, body){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), kind, body})); }catch(e){} }
function readCache(){ try{ const j=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); return (j&&j.body)?j:null; }catch(e){ return null; } }
function cacheToData(c){ return c.kind==="rich" ? richToData(c.body) : csvToData(c.body); }

// GAS 回傳 {ok, rows:[{日期,來源,摘要,機隊,緊急度,runs:[{t,c,b,i,u}]}]}
function richToData(text){
  const j=JSON.parse(text);
  if(!j || !Array.isArray(j.rows)) return [];
  return j.rows.map(r=>({日期:String(r.日期||"").trim(), 來源:String(r.來源||"").trim(), 摘要:String(r.摘要||"").trim(),
    機隊:String(r.機隊||"").trim(), 緊急度:String(r.緊急度||"").trim(), runs:Array.isArray(r.runs)?r.runs:null}))
    .filter(x=>x.日期||x.來源||x.摘要);
}

function parseCSV(text){
  const rows=[]; let row=[], field="", inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===',') { row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c!=='\r') field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function csvToData(text){
  const rows=parseCSV(text).filter(r=>r.some(x=>(x||"").trim()));
  if(!rows.length) return [];
  const head=rows[0].map(h=>h.trim());
  const di=head.indexOf("日期"), si=head.indexOf("來源"), mi=head.indexOf("摘要"),
        fi=head.indexOf("機隊"), ui=head.indexOf("緊急度");
  return rows.slice(1).map(r=>({
      日期:(r[di]||"").trim(), 來源:(r[si]||"").trim(), 摘要:(r[mi]||"").trim(),
      機隊:(fi>=0?(r[fi]||""):"").trim(), 緊急度:(ui>=0?(r[ui]||""):"").trim()
    })).filter(x=>x.日期||x.來源||x.摘要);
}

function classifySource(src){
  const s=(src||"").trim();
  if(/^(FN|OR)[-\s]/i.test(s)) return {cat:"Fleet Notice",cls:"fn",label:"Fleet Notice",code:s};
  if(/outlook/i.test(s))       return {cat:"Outlook",cls:"outlook",label:"Outlook",code:""};
  if(/teams/i.test(s))         return {cat:"Teams",cls:"teams",label:"Teams",code:""};
  if(/line/i.test(s))          return {cat:"others",cls:"line",label:"Line",code:""};
  return {cat:"others",cls:"others",label:(s||"others"),code:""};
}
function detectFleet(t){
  t=t||""; const f=[];
  if(/A?32[01]\b/.test(t)) f.push("A321");
  if(/A?330\b|(?<![\d.,])330(?![\d.,])/.test(t)) f.push("A330");
  if(/A?350\b/.test(t)) f.push("A350");
  return f.length?f:["ALL"];
}
function parseDate(d){
  const m=String(d||"").match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
// 把摘要切成「行」，每行是一串文字片段 {t, c(顏色), b(粗體)}；CSV 沒有樣式時每行就一個片段
const BULLET_RE=/^[\s•·・‧∙●○◦▪▫■□\-–—*]+/;
function toLines(row){
  const runs=row.runs && row.runs.length ? row.runs : [{t:row.摘要||""}];
  const lines=[[]];
  runs.forEach(r=>{
    String(r.t||"").split("\n").forEach((part,k)=>{
      if(k>0) lines.push([]);
      if(part) lines[lines.length-1].push({t:part, c:r.c, b:r.b, i:r.i, u:r.u});
    });
  });
  // 去掉每行開頭自帶的 •、·、- 等符號（可能跨越多個片段）
  return lines.map(segs=>{
    while(segs.length){
      const s0=segs[0], t=s0.t.replace(BULLET_RE,"");
      if(t){ segs[0]={...s0, t}; break; }
      segs.shift();
    }
    return segs;
  }).filter(segs=>segs.some(s=>s.t.trim()));
}
const lineText=segs=>segs.map(s=>s.t).join("").trim();
function normalize(row){
  const sum=(row.摘要||"").trim(), lines=sum.split("\n"), src=classifySource(row.來源);
  const segLines=toLines(row);
  // 機隊：優先用「機隊」欄，沒填才從摘要文字偵測
  let fleet;
  if(row.機隊){
    fleet=row.機隊.split(/[,，、\s]+/).filter(Boolean)
      .map(s=>{s=s.toUpperCase(); return (s==="全機隊"||s==="全部"||s==="ALL")?"ALL":s;});
    if(!fleet.length) fleet=["ALL"];
  }else fleet=detectFleet(sum);
  // 緊急度：只看「緊急度」欄（urgent/important 才標橘色重點），不再用關鍵字猜
  const urg=(row.緊急度||"").toLowerCase();
  return {date:row.日期||"",_d:parseDate(row.日期),src,fleet,
    important:(urg==="urgent"||urg==="important"|| /需要動作[：:]/.test(sum)),urgency:urg,
    title:(lines[0]||"（無標題）").trim(),
    titleSegs:segLines[0]||[{t:"（無標題）"}], restLines:segLines.slice(1),
    rest:lines.slice(1).join("\n").trim(),full:sum,source:row.來源||""};
}

const SRC_FILTERS=["全部","Fleet Notice","Outlook","Teams","others"];
const FLEET_FILTERS=["全部機隊","A321","A330","A350"];
let activeSrc="全部", activeFleet="全部機隊", keyword="", DATA=[];

async function loadData(){
  // 連線成功不顯示狀態文字，只有失敗時才提示
  const st=document.getElementById("status");
  st.style.display="none"; st.className="status";
  let data, ok=true;
  try{
    data=null;
    if(RICH_URL){
      try{
        const r=await fetch(RICH_URL,{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const text=await r.text();
        const d=richToData(text);
        if(d.length){ data=d; saveCache("rich", text); }
      }catch(e){ console.warn("公告顏色來源失敗，改讀 CSV：", e); }
    }
    if(!data){
      const res=await fetch(CSV_URL,{cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text=await res.text();
      data=csvToData(text);
      if(!data.length) throw new Error("empty");
      saveCache("csv", text);
    }
  }catch(e){
    ok=false;
    const c=readCache();
    data=c?cacheToData(c):[];
    if(c){
      const d=new Date(c.t), p=n=>String(n).padStart(2,"0");
      st.textContent=`⚠ 目前無法連線，顯示 ${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())} 的資料`;
    }else{
      st.textContent="⚠ 無法載入公告，請確認網路後按「重新整理」";
    }
    st.className="status err"; st.style.display="block";
  }
  DATA=data.map(normalize).sort((a,b)=>(b._d?+b._d:0)-(a._d?+a._d:0));
  // 7 天內（含今天、含未來生效日）的公告高亮，超過自動恢復一般樣式
  const cutoff=new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-6);
  DATA.forEach(x=> x.isRecent = !!(x._d && x._d>=cutoff) );
  render();
  return ok;
}

// 手動「重新整理」：給明確的按下→轉圈→完成回饋，避免使用者不確定有沒有按到
let refreshing=false;
async function manualRefresh(){
  if(refreshing) return;
  refreshing=true;
  const btn=document.getElementById("refresh");
  const st=document.getElementById("status");
  const txt=btn.querySelector(".txt");
  btn.classList.remove("done"); btn.classList.add("loading"); btn.disabled=true;
  if(txt) txt.textContent="更新中…";
  st.className="status"; st.style.display="block"; st.textContent="⏳ 正在重新整理公告…";
  const started=Date.now();
  let ok=false;
  try{ ok=await loadData(); }catch(e){ ok=false; }
  // 至少轉半秒，讓「有按到」的回饋看得見
  const wait=Math.max(0,550-(Date.now()-started));
  await new Promise(r=>setTimeout(r,wait));
  btn.classList.remove("loading"); btn.disabled=false;
  if(txt) txt.textContent="重新整理";
  if(ok){
    const t=new Date().toLocaleTimeString("zh-TW",{hour12:false,hour:"2-digit",minute:"2-digit"});
    btn.classList.add("done");
    st.className="status ok"; st.style.display="block"; st.textContent=`✅ 公告已更新（${t}）`;
    setTimeout(()=>{ btn.classList.remove("done"); if(st.classList.contains("ok")){st.style.display="none";} },3000);
  }
  // 失敗時 loadData 已把 err 訊息寫進 status，保留顯示
  refreshing=false;
}
function matches(it){
  if(activeSrc!=="全部" && it.src.cat!==activeSrc) return false;
  if(activeFleet!=="全部機隊" && !(it.fleet.includes(activeFleet)||it.fleet.includes("ALL"))) return false;
  if(keyword && !it.full.toLowerCase().includes(keyword.toLowerCase()) && !it.source.toLowerCase().includes(keyword.toLowerCase())) return false;
  return true;
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// 搜尋關鍵字標亮（先跳脫再標，避免插入 HTML）
function hl(s){
  const e=esc(s);
  if(!keyword) return e;
  const k=esc(keyword).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return e.replace(new RegExp(k,"gi"),m=>`<mark>${m}</mark>`);
}
// 片段 → HTML：保留試算表的文字顏色與粗體（黑色視為預設，不另外上色）
function segsHTML(segs){
  return segs.map(s=>{
    let h=hl(s.t);
    const st=[];
    const c=String(s.c||"").toLowerCase();
    if(/^#[0-9a-f]{6}$/.test(c) && c!=="#000000") st.push(`color:${c}`);
    if(s.b) st.push("font-weight:700");
    if(s.i) st.push("font-style:italic");
    if(s.u) st.push("text-decoration:underline");
    return st.length?`<span style="${st.join(";")}">${h}</span>`:h;
  }).join("");
}
// 日期統一為 MM/DD；不是今年才加年份
function fmtDate(it){
  if(!it._d) return esc(it.date||"");
  const p=n=>String(n).padStart(2,"0"), d=it._d;
  const md=`${p(d.getMonth()+1)}/${p(d.getDate())}`;
  return d.getFullYear()===new Date().getFullYear()?md:`${d.getFullYear()}/${md}`;
}
// 距發佈幾天：today／1 day／5 days；未來生效日顯示 in 3 days
function agoHTML(it,cls="ago"){
  if(!it._d) return "";
  const t=new Date(); t.setHours(0,0,0,0);
  const n=Math.round((t-it._d)/86400000);
  const txt = n===0 ? "today" : n>0 ? `${n} day${n>1?"s":""}` : `in ${-n} day${n<-1?"s":""}`;
  return `<span class="${cls}">${txt}</span>`;
}
function metaHTML(it){
  let h=`<span class="src ${it.src.cls}">${esc(it.src.label)}</span>`;
  if(it.src.code) h+=`<span class="code">${hl(it.src.code)}</span>`;
  h+=`<span class="spacer"></span>`;
  h+=`<span class="date">${fmtDate(it)}</span>${agoHTML(it)}`;
  return h;
}
// 全螢幕閱讀內容：內文每行一個重點；「需要動作：…」抽出來做成醒目框
function detailHTML(it){
  // 每行一個重點（開頭的 •、· 已在 toLines 去掉）；「需要動作：…」抽出來做成醒目框
  let action=""; const points=[];
  (it.restLines||[]).forEach(segs=>{
    const m=lineText(segs).match(/^[⚡\s]*需要動作[：:]\s*(.*)$/);
    if(m) action=m[1].trim(); else points.push(segs);
  });
  const srcStyle=getComputedStyle(document.querySelector(`.src.${it.src.cls}`)||document.body);
  let h=`<div class="nd-card" role="dialog" aria-label="公告內容">
    <div class="nd-meta"><span class="nd-src" style="color:${srcStyle.color};background:${srcStyle.backgroundColor}">${esc(it.src.label)}</span>`;
  if(it.src.code) h+=`<span class="nd-code">${hl(it.src.code)}</span>`;
  h+=`<span class="sp"></span><span class="nd-date">${fmtDate(it)}</span>${agoHTML(it,"nd-ago")}</div>
    <div class="nd-title">${segsHTML(it.titleSegs)}</div>`;
  if(points.length) h+=`<ul class="nd-points">${points.map(p=>`<li>${segsHTML(p)}</li>`).join("")}</ul>`;
  else if(!action)  h+=`<div class="nd-empty">（無更多內容）</div>`;
  if(action) h+=`<div class="nd-action"><span>⚡</span><span>需要動作：${hl(action)}</span></div>`;
  h+=`<div class="nd-foot"><span>來源 <b>${esc(it.source)||"—"}</b></span><span>日期 <b>${esc(it.date)||"—"}</b></span></div></div>`;
  return h;
}
// 點公告 → 全螢幕閱讀。嵌在首頁時交給首頁顯示（蓋住整個畫面、不影響公告欄排版）；單獨開啟時在本頁顯示
function openDetail(it){
  const html=detailHTML(it);
  if(window.parent && window.parent!==window){
    try{ window.parent.postMessage({type:"notice-open", html}, location.origin); return; }catch(e){}
  }
  const lb=document.getElementById("nd-lb");
  lb.innerHTML=`<div style="width:100%;max-width:760px"><div class="nd-cap">點背景或按 Esc 關閉</div>${html}<button class="nd-close" type="button">✕ 關閉</button></div>`;
  lb.classList.add("open");
  lb.querySelector(".nd-close").onclick=()=>lb.classList.remove("open");
}
document.getElementById("nd-lb").addEventListener("click",e=>{ if(e.target.id==="nd-lb") e.currentTarget.classList.remove("open"); });
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  document.getElementById("nd-lb").classList.remove("open");
  // 焦點還在公告欄（iframe）裡時，Esc 也要能關掉首頁上的全螢幕閱讀
  if(window.parent && window.parent!==window){ try{ window.parent.postMessage({type:"notice-close"}, location.origin); }catch(err){} }
});
function render(){
  const list=document.getElementById("list"), rows=DATA.filter(matches);
  if(!rows.length){ list.innerHTML=`<div class="empty">${DATA.length?"沒有符合的公告":"目前沒有公告"}</div>`; return; }
  list.innerHTML=rows.map((it,i)=>`
    <div class="card${it.important?" important":""}${it.isRecent?" recent":""}" data-i="${i}" role="button" tabindex="0">
      <div class="meta">${metaHTML(it)}</div>
      <div class="title">${segsHTML(it.titleSegs)}</div>
      <span class="chev">⤢</span>
    </div>`).join("");
  list.querySelectorAll(".card").forEach(c=>{
    const it=rows[+c.dataset.i];
    c.addEventListener("click",()=>openDetail(it));
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openDetail(it); } });
  });
}
function buildFilters(){
  const mk=(arr,active,boxId,set)=>{
    const box=document.getElementById(boxId);
    box.innerHTML=arr.map(f=>`<button class="chip-f ${f===active?"active":""}" data-f="${f}">${f}</button>`).join("");
    box.querySelectorAll(".chip-f").forEach(b=>b.addEventListener("click",()=>{ set(b.dataset.f); buildFilters(); render(); }));
  };
  mk(SRC_FILTERS,activeSrc,"srcFilters",v=>activeSrc=v);
  // 機隊列已依需求移除（activeFleet 固定「全部機隊」，matches() 不受影響）
}
document.getElementById("q").addEventListener("input",e=>{ keyword=e.target.value; render(); });
document.getElementById("refresh").addEventListener("click",manualRefresh);
buildFilters(); loadData();
</script>
