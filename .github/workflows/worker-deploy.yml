name: Deploy Briefing Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  # 允許從 Actions 頁面手動觸發
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 從 worker/ 目錄部署（wrangler.toml：name = briefing-package，main = worker.js）
          # → https://briefing-package.zihchi.workers.dev
          # 用 .toml 而非根目錄的 .jsonc：wrangler-action 預設安裝的舊版 wrangler 不解析 .jsonc。
          # 已在 Worker 上設好的 secrets（LIDO_* / AeroDataBox 等）不會被此步驟覆蓋。
          workingDirectory: worker
