name: Turbli 湍流圖預先抓取

on:
  # 2026-08-17 曾因 turbli 的 Cloudflare 擋 GitHub Actions IP 而暫停；
  # 2026-11-24 手動測試已可抓到圖（55 張成功，失敗多為 HTTP 429 太頻繁），恢復每 3 小時排程。
  # 若日後又全數被擋，把下面 schedule 註解掉即可；前端 cache miss 時仍有「即時開 turbli」退路。
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 允許 workflow 把產生的 PNG 推回 repo
permissions:
  contents: write

jobs:
  generate:
    # 固定 24.04：ubuntu-latest 已升到 26.04，Playwright 1.60 不支援、裝不了 Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.60.0
          playwright install --with-deps chromium

      - name: Generate charts
        # 並行 2、每次請求後等 6~12 秒：並行 4 時約 1/3 請求被 turbli 回 429（太頻繁）
        run: python scripts/generate_charts.py --concurrency 2 --delay 6

      - name: Commit & push if charts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chartcache/
          if git diff --staged --quiet; then
            echo "📭 沒有檔案變動，跳過 commit"
            exit 0
          fi
          COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
          git commit -m "chore(chartcache): refresh ${COUNT} turbulence charts [skip ci]"

          # 這個 job 會跑十幾分鐘，期間 main 可能已被其他 push 推進，
          # 直接 push 會因 non-fast-forward 被拒。先 rebase 再 push，並重試。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "📤 已推送 ${COUNT} 張圖更新"
              exit 0
            fi
            echo "⚠️  push 被拒（第 ${attempt} 次），先 git pull --rebase 再重試…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          echo "❌ 重試 5 次仍無法 push"
          exit 1
