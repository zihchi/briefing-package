<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PA 廣播稿</title>
<style>html,body{margin:0;padding:0;background:#f4ece4;} body{padding:14px;}</style>
</head>
<body>
<!-- 📢 PA 廣播稿工具 — 星宇 FOM Ch.8 範本 + 溫度換算 + 班號帶入起訖地與時差（全離線） -->
<div id="paTool">
<style>
  #paTool{
    --pa-brand:#8b5a2b; --pa-brand-d:#7a4e23;
    --pa-bg:#f4ece4; --pa-surface:#ffffff; --pa-card:#faf6f0;
    --pa-border:#e7ddd0; --pa-text:#4a3627; --pa-muted:#78716c; --pa-faint:#a8a29e;
    --pa-blue:#1d4ed8; --pa-blue-bg:#eaf1ff;
    --pa-fill:#8b5a2b; --pa-fill-bg:#f6eddd;
    color:var(--pa-text);
    -webkit-text-size-adjust:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  }
  #paTool *{box-sizing:border-box;}
  #paTool .pa-wrap{display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:16px;}
  @media (max-width:860px){ #paTool .pa-wrap{grid-template-columns:1fr;} }

  #paTool .pa-card{background:var(--pa-surface); border:1px solid var(--pa-border); border-radius:16px; padding:14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(74,54,39,.06);}
  #paTool .pa-card h3{margin:0 0 4px; font-size:1rem; font-weight:800; display:flex; align-items:center; gap:8px;}
  #paTool .pa-sub{font-size:.78rem; color:var(--pa-muted); margin:0 0 12px; line-height:1.5;}
  #paTool label.pa-lbl{font-size:.72rem; font-weight:800; color:var(--pa-faint); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}

  /* 溫度 */
  #paTool .pa-temp{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:end;}
  #paTool .pa-temp .swap{align-self:center; margin-bottom:8px; color:var(--pa-brand); font-size:1.2rem;}
  #paTool input.pa-in{width:100%; padding:10px; border:1px solid var(--pa-border); border-radius:10px; background:var(--pa-surface); color:var(--pa-text); font-size:1.15rem; font-weight:700; text-align:center; font-family:ui-monospace,monospace;}
  #paTool input.pa-in:focus{outline:none; border-color:var(--pa-brand); box-shadow:0 0 0 2px rgba(139,90,43,.18);}
  #paTool .pa-in-row{display:flex; gap:8px;}
  #paTool .pa-in-row input{flex:1;}

  /* 航班 */
  #paTool .pa-flt-in{text-transform:uppercase; letter-spacing:.05em;}
  #paTool .pa-flt-in::placeholder{text-transform:none; letter-spacing:normal;}
  #paTool .pa-btn{border:none; background:var(--pa-brand); color:#fff; font-weight:800; padding:10px 14px; border-radius:10px; cursor:pointer; font-size:.95rem;}
  #paTool .pa-btn:active{transform:scale(.97);}
  #paTool .pa-btn.ghost{background:transparent; color:var(--pa-brand); border:1px solid var(--pa-border);}
  #paTool .pa-route{margin-top:12px; display:none;}
  #paTool .pa-route.show{display:block;}
  #paTool .pa-route-line{display:flex; align-items:center; justify-content:center; gap:12px; font-weight:800; font-size:1.15rem;}
  #paTool .pa-route-line .arr{color:var(--pa-brand);}
  #paTool .pa-ap{ text-align:center;}
  #paTool .pa-ap .code{font-size:1.35rem; font-weight:900; letter-spacing:.03em;}
  #paTool .pa-ap .zh{font-size:.82rem; color:var(--pa-muted);}
  #paTool .pa-dest-meta{margin-top:12px; background:var(--pa-card); border:1px solid var(--pa-border); border-radius:12px; padding:12px;}
  #paTool .pa-meta-row{display:flex; justify-content:space-between; align-items:baseline; padding:4px 0; font-size:.9rem;}
  #paTool .pa-meta-row .k{color:var(--pa-muted);}
  #paTool .pa-meta-row .v{font-weight:800; font-family:ui-monospace,monospace;}
  #paTool .pa-meta-row .v.big{font-size:1.25rem; color:var(--pa-brand);}
  #paTool .pa-hint{font-size:.8rem; color:var(--pa-faint); margin-top:8px;}

  /* 手動選目的地 */
  #paTool select.pa-sel{width:100%; padding:10px; border:1px solid var(--pa-border); border-radius:10px; background:var(--pa-surface); color:var(--pa-text); font-weight:700; font-size:.95rem;}

  /* 站點時間表 */
  #paTool .pa-stations{max-height:320px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #paTool .pa-grp-h{font-size:.72rem; font-weight:800; color:var(--pa-faint); margin:10px 2px 4px; text-transform:uppercase; letter-spacing:.04em;}
  #paTool .pa-st{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--pa-border); border-radius:10px; margin-bottom:6px; cursor:pointer; background:var(--pa-card);}
  #paTool .pa-st:hover{border-color:var(--pa-brand);}
  #paTool .pa-st.active{border-color:var(--pa-brand); background:var(--pa-fill-bg);}
  #paTool .pa-st .st-code{font-weight:900; width:44px;}
  #paTool .pa-st .st-zh{flex:1; font-size:.85rem; color:var(--pa-muted);}
  #paTool .pa-st .st-time{font-weight:800; font-family:ui-monospace,monospace;}
  #paTool .pa-st .st-off{font-size:.72rem; color:var(--pa-faint); width:56px; text-align:right;}

  /* 廣播稿 */
  #paTool .pa-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  #paTool .pa-tab{border:1px solid var(--pa-border); background:var(--pa-surface); color:var(--pa-muted); padding:7px 12px; border-radius:999px; cursor:pointer; font-size:.82rem; font-weight:700;}
  #paTool .pa-tab.active{background:var(--pa-fill-bg); color:var(--pa-brand); border-color:var(--pa-brand);}
  #paTool .pa-scriptbox{background:var(--pa-surface); border:1px solid var(--pa-border); border-radius:16px; padding:16px;}
  #paTool .pa-note{font-size:.82rem; color:var(--pa-muted); background:var(--pa-card); border-left:3px solid var(--pa-brand); padding:8px 12px; border-radius:8px; margin-bottom:14px; line-height:1.6;}
  #paTool .pa-sech{font-size:.8rem; font-weight:800; color:var(--pa-blue); display:flex; align-items:center; gap:8px; margin:16px 0 8px;}
  #paTool .pa-sech .cp{margin-left:auto; font-size:.72rem; font-weight:700; color:var(--pa-brand); border:1px solid var(--pa-border); border-radius:999px; padding:3px 10px; cursor:pointer; background:var(--pa-surface);}
  #paTool .pa-script{font-size:1.02rem; line-height:2.1; color:var(--pa-text);}
  #paTool .pa-script.zh{line-height:2.3;}
  #paTool .pa-optnote{font-size:.8rem; color:var(--pa-faint);}

  /* 填空 */
  #paTool .ph{display:inline-block; min-width:52px; padding:0 6px; margin:0 2px; border-bottom:1.5px dashed var(--pa-faint); text-align:center; color:var(--pa-muted); font-weight:700; cursor:text; border-radius:4px 4px 0 0;}
  #paTool .ph:empty::before{content:attr(data-hint); color:var(--pa-faint); font-weight:400; font-style:italic;}
  #paTool .ph:focus{outline:none; background:var(--pa-blue-bg); border-bottom-color:var(--pa-blue); color:var(--pa-text);}
  #paTool .auto{display:inline-block; padding:0 7px; margin:0 2px; background:var(--pa-fill-bg); color:var(--pa-brand); border-radius:6px; font-weight:800; border-bottom:1.5px dashed var(--pa-brand);}
  #paTool .auto.empty{color:var(--pa-faint); background:transparent; font-weight:400; font-style:italic;}
  #paTool .opt{color:var(--pa-faint); font-style:italic;}
</style>

<div class="pa-wrap">
  <!-- ============ 左側控制 ============ -->
  <div class="pa-left">

    <!-- 航班 -->
    <div class="pa-card">
      <h3>✈️ 航班資訊</h3>
      <p class="pa-sub">輸入班號，自動帶出起訖地、目的地當地日期與時差（離線）。</p>
      <label class="pa-lbl">班號 Flight No.</label>
      <div class="pa-in-row">
        <input id="paFlt" class="pa-in pa-flt-in" inputmode="text" autocomplete="off" placeholder="ex. 012" spellcheck="false">
        <button id="paFltBtn" class="pa-btn">查詢</button>
      </div>
      <div id="paRoute" class="pa-route">
        <div class="pa-route-line">
          <div class="pa-ap"><div class="code" id="paFrCode">TPE</div><div class="zh" id="paFrZh">臺北/桃園</div></div>
          <div class="arr">→</div>
          <div class="pa-ap"><div class="code" id="paToCode">—</div><div class="zh" id="paToZh"></div></div>
        </div>
        <div class="pa-dest-meta">
          <div class="pa-meta-row"><span class="k">目的地當地時間</span><span class="v big" id="paDestTime">--:--</span></div>
          <div class="pa-meta-row"><span class="k">當地日期</span><span class="v" id="paDestDate">—</span></div>
          <div class="pa-meta-row"><span class="k">與出發地時差</span><span class="v" id="paDestDiff">—</span></div>
        </div>
      </div>
    </div>

    <!-- 溫度 -->
    <div class="pa-card">
      <h3>🌡️ 溫度換算</h3>
      <p class="pa-sub">攝氏 ⇄ 華氏雙向連動，自動帶入 Descent 廣播稿的溫度欄。</p>
      <div class="pa-temp">
        <div><label class="pa-lbl">°C 攝氏</label><input id="paC" class="pa-in" inputmode="decimal" placeholder="??"></div>
        <div class="swap">⇄</div>
        <div><label class="pa-lbl">°F 華氏</label><input id="paF" class="pa-in" inputmode="decimal" placeholder="??"></div>
      </div>
    </div>

    <!-- 站點時間（預設收合，點標題展開）-->
    <div class="pa-card">
      <h3 id="paStHead" style="cursor:pointer; user-select:none;">🕒 當地時間對照 <span id="paStCaret" style="font-size:.8em; color:var(--pa-faint); font-weight:400;">▸ 展開</span></h3>
      <p class="pa-sub" id="paStSub" style="display:none;">星宇航點即時當地時間（離線計算，含日光節約）。點一下設為 PA 目的地。</p>
      <div id="paStations" class="pa-stations" style="display:none;"></div>
    </div>
  </div>

  <!-- ============ 右側廣播稿 ============ -->
  <div class="pa-right">
    <div class="pa-tabs" id="paTabs"></div>
    <div class="pa-scriptbox" id="paScriptBox"></div>
  </div>
</div>
</div>

<script>
(function(){
  var root = document.getElementById('paTool');
  if(!root || root.dataset.init) return;
  root.dataset.init = '1';
  var $ = function(id){ return document.getElementById(id); };

  // ---------- 資料：航點（IATA → 中文 / IANA 時區） ----------
  var AP = {
    TPE:{zh:'臺北/桃園',tz:'Asia/Taipei'},
    SFO:{zh:'舊金山',tz:'America/Los_Angeles'}, LAX:{zh:'洛杉磯',tz:'America/Los_Angeles'},
    ONT:{zh:'安大略',tz:'America/Los_Angeles'}, SEA:{zh:'西雅圖',tz:'America/Los_Angeles'},
    PHX:{zh:'鳳凰城',tz:'America/Phoenix'},
    PRG:{zh:'布拉格',tz:'Europe/Prague'}, AUH:{zh:'阿布達比',tz:'Asia/Dubai'},
    KUL:{zh:'吉隆坡',tz:'Asia/Kuala_Lumpur'}, SIN:{zh:'新加坡',tz:'Asia/Singapore'},
    CGK:{zh:'雅加達',tz:'Asia/Jakarta'},
    BKK:{zh:'曼谷',tz:'Asia/Bangkok'}, CNX:{zh:'清邁',tz:'Asia/Bangkok'},
    SGN:{zh:'胡志明市',tz:'Asia/Ho_Chi_Minh'}, HAN:{zh:'河內',tz:'Asia/Ho_Chi_Minh'},
    DAD:{zh:'峴港',tz:'Asia/Ho_Chi_Minh'}, PQC:{zh:'富國島',tz:'Asia/Ho_Chi_Minh'},
    CRK:{zh:'克拉克',tz:'Asia/Manila'}, MNL:{zh:'馬尼拉',tz:'Asia/Manila'}, CEB:{zh:'宿霧',tz:'Asia/Manila'},
    HKG:{zh:'香港',tz:'Asia/Hong_Kong'}, MFM:{zh:'澳門',tz:'Asia/Macau'},
    PUS:{zh:'釜山',tz:'Asia/Seoul'}, ICN:{zh:'首爾/仁川',tz:'Asia/Seoul'},
    NRT:{zh:'東京/成田',tz:'Asia/Tokyo'}, KIX:{zh:'大阪/關西',tz:'Asia/Tokyo'}, NGO:{zh:'名古屋',tz:'Asia/Tokyo'},
    FUK:{zh:'福岡',tz:'Asia/Tokyo'}, CTS:{zh:'札幌',tz:'Asia/Tokyo'}, SDJ:{zh:'仙台',tz:'Asia/Tokyo'},
    HKD:{zh:'函館',tz:'Asia/Tokyo'}, OKA:{zh:'沖繩/那霸',tz:'Asia/Tokyo'}, KMJ:{zh:'熊本',tz:'Asia/Tokyo'},
    UKB:{zh:'神戶',tz:'Asia/Tokyo'}, SHI:{zh:'宮古/下地島',tz:'Asia/Tokyo'}
  };

  // ---------- 資料：班號 → 航線（2026/07/27–08/02 定期班表） ----------
  var OUT = {JX012:'SFO',JX002:'LAX',JX101:'PRG',JX789:'CRK',JX834:'UKB',JX761:'CGK',JX781:'CEB',JX785:'MNL',JX846:'KMJ',JX711:'SGN',JX201:'MFM',JX715:'HAN',JX771:'SIN',JX233:'HKG',JX900:'PUS',JX1834:'UKB',JX820:'KIX',JX741:'BKK',JX840:'FUK',JX850:'CTS',JX822:'KIX',JX802:'NRT',JX800:'NRT',JX890:'SHI',JX1900:'PUS',JX725:'KUL',JX862:'SDJ',JX860:'HKD',JX870:'OKA',JX705:'PQC',JX751:'CNX',JX745:'BKK',JX713:'SGN',JX717:'HAN',JX902:'PUS',JX838:'NGO',JX804:'NRT',JX203:'MFM',JX703:'DAD',JX205:'MFM',JX783:'CEB',JX235:'HKG',JX791:'CRK',JX7301:'AUH',JX010:'ONT',JX026:'PHX',JX032:'SEA'};
  var IN = {JX031:'SEA',JX009:'ONT',JX011:'SFO',JX025:'PHX',JX001:'LAX',JX102:'PRG',JX7300:'AUH',JX790:'CRK',JX202:'MFM',JX786:'MNL',JX234:'HKG',JX847:'KMJ',JX835:'UKB',JX782:'CEB',JX901:'PUS',JX891:'SHI',JX1835:'UKB',JX716:'HAN',JX821:'KIX',JX841:'FUK',JX712:'SGN',JX871:'OKA',JX1901:'PUS',JX801:'NRT',JX823:'KIX',JX742:'BKK',JX772:'SIN',JX762:'CGK',JX803:'NRT',JX851:'CTS',JX863:'SDJ',JX903:'PUS',JX1847:'KMJ',JX204:'MFM',JX861:'HKD',JX718:'HAN',JX839:'NGO',JX726:'KUL',JX236:'HKG',JX706:'PQC',JX752:'CNX',JX704:'DAD',JX714:'SGN',JX792:'CRK',JX206:'MFM',JX746:'BKK',JX784:'CEB',JX805:'NRT'};

  // ---------- 時間工具（離線） ----------
  function offsetMin(tz, date){
    // 取得某時區相對 UTC 的分鐘偏移
    var d = date || new Date();
    var s = d.toLocaleString('en-US',{timeZone:tz});
    var u = d.toLocaleString('en-US',{timeZone:'UTC'});
    return Math.round((new Date(s) - new Date(u))/60000);
  }
  function parts(tz, date){
    var d = date || new Date();
    var f = new Intl.DateTimeFormat('en-GB',{timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short', month:'2-digit', day:'2-digit'});
    var o = {}; f.formatToParts(d).forEach(function(p){ o[p.type]=p.value; });
    return o; // {weekday,day,month,hour,minute}
  }
  var WD_EN = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
  var WD_ZH = {Mon:'星期一',Tue:'星期二',Wed:'星期三',Thu:'星期四',Fri:'星期五',Sat:'星期六',Sun:'星期日'};
  function ampm(h){ return h < 12 ? 'a.m.' : 'p.m.'; }
  function to12(h){ h=h%12; return h===0?12:h; }
  function pad(n){ return (n<10?'0':'')+n; }
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function monEN(mm){ return MON[parseInt(mm,10)-1] || mm; }

  function diffText(destTz, fromCode){
    var fromTz = (AP[fromCode] || AP.TPE).tz;
    var d = (offsetMin(destTz) - offsetMin(fromTz))/60;
    if(Math.abs(d) < 0.01) return '與出發地相同';
    var sign = d>0 ? '快' : '慢';
    var h = Math.abs(d);
    var hs = (h % 1 === 0) ? h.toFixed(0) : h.toFixed(1);
    return '比出發地' + sign + ' ' + hs + ' 小時';
  }

  // ---------- 廣播稿範本 ----------
  // 佔位符：{{auto:token}} 自動帶入；{{ph:hint}} 手動填空；{{opt:文字}} 斜體提示
  var TPL = {
    welcome:{ name:'Welcome 歡迎', note:'全機旅客登機完畢後，由 CIC 通知 PIC 做簡短歡迎廣播。',
      en:'"Hello everyone, this is Captain {{ph:機長姓名}} speaking. On behalf of {{opt:the cockpit crew / all the crew}}, welcome onboard STARLUX flight number {{auto:flt}} to {{auto:dest_en}}. We should be ready for departure in {{ph:XX}} minutes. Our flight time is {{ph:OO}} hours and {{ph:XX}} minutes, with an initial cruising altitude of {{ph:XX,XXX}} feet. Once again, please make yourself comfortable and enjoy the flight with us. Thank you."',
      zh:'「各位貴賓您好，我是本次航班的機長 {{ph:姓名}}。僅代表{{opt:駕駛艙組員 / 全體組員}}，歡迎您搭乘星宇航空 {{auto:flt}} 班機前往 {{auto:dest_zh}}。我們預計在 {{ph:XX}} 分鐘後準備起飛，飛行時間約為 {{ph:OO}} 小時 {{ph:XX}} 分，初始巡航高度 {{ph:XX,XXX}} 英尺。再次歡迎您的搭乘，敬祝旅途愉快，謝謝。」' },

    delay:{ name:'Ground Delay 地面延誤', note:'推出前預計延誤超過 15 分鐘時廣播。',
      en:'"Hello everyone, this is your captain speaking. Due to {{ph:延誤原因}}, we might be delayed up to {{ph:XX}} minutes before takeoff. I will keep you updated if longer delay happens. Thank you for your patience."',
      zh:'「各位貴賓您好，這裡是機長廣播。由於 {{ph:延誤原因}}，我們起飛前可能會延誤約 {{ph:XX}} 分鐘。若有進一步延誤，我會再向各位報告。感謝您的耐心等候，謝謝。」' },

    descent:{ name:'Descent 下降', note:'約在 top of descent 前 10 分鐘廣播（PIC 需先提供 ETA、TOD、目的地天氣給 CIC）。',
      en:'"Hello everyone, this is your captain speaking. We are approaching {{auto:dest_en}} and expect to start our descent in 10 minutes. We estimate landing at {{ph:OO:XX}} {{opt:a.m./p.m.}}. The current local time in {{auto:dest_en}} is {{auto:local_en}} on {{auto:daydate_en}}. The present weather at the airport is {{ph:天氣狀況}} with a temperature of {{auto:temp_c}} degree Celsius, which is {{auto:temp_f}} degree Fahrenheit. We certainly hope that you have enjoyed the flight with us, and we look forward to having you onboard another STARLUX flight again very soon. Thank you, and we wish you all a very pleasant journey."',
      zh:'「各位貴賓您好，這裡是機長廣播。我們即將抵達 {{auto:dest_zh}}，預計在 10 分鐘後開始下降。預計落地時間為 {{ph:OO:XX}} {{opt:上午/下午}}。{{auto:dest_zh}} 當地時間為 {{auto:daydate_zh}} {{auto:local_zh}}。目前機場天氣為 {{ph:天氣狀況}}，氣溫攝氏 {{auto:temp_c}} 度，換算華氏 {{auto:temp_f}} 度。非常感謝各位搭乘星宇航空，期待很快再次為您服務。敬祝各位旅途愉快，謝謝。」' },

    turb:{ name:'Turbulence 亂流', note:'接近或遭遇亂流、且工作量許可時使用。',
      en:'i. 接近已知/預報亂流區\n"Hello everyone, this is your Captain speaking. We will soon be flying through an area with light to moderate turbulence. We have already made {{opt:changes to our route and altitude / deviations}} to provide you with the smoothest flight possible. To ensure your safety, please stay in your seats and fasten your seat belt."\n\nii. 請客艙組員就座\n"For the safety of the cabin crew, I have asked them to stop the inflight service, take their seats, and remain seated, until we have passed through this area. We apologize for any inconvenience. The inflight service will resume as soon as flight conditions permit. We expect these conditions to last for approximately {{ph:OO}} minutes. Your cooperation and understanding are always appreciated. Thank you."',
      zh:'i. 接近已知/預報亂流區\n「各位貴賓您好，這裡是機長廣播。我們即將通過一段輕度至中度亂流區。我們已{{opt:調整航路與高度 / 進行繞飛}}，盡量提供各位最平穩的飛行。為了您的安全，請留在座位上並繫好安全帶。」\n\nii. 請客艙組員就座\n「為了客艙組員的安全，我已請他們暫停客艙服務並回座繫好安全帶，直到我們通過這段區域為止。造成不便敬請見諒，待飛行狀況許可將立即恢復服務。預計這段狀況約持續 {{ph:OO}} 分鐘。感謝各位的配合與諒解，謝謝。」' },

    deice:{ name:'De/Anti-ice 除冰', note:'',
      en:'"Hello everyone, welcome on board. This is your Captain speaking. Today we must complete a procedure to protect the aircraft against the build-up of ice. And we will be on ground for {{ph:OO}} minutes. {{opt:(若有延誤)}} This will involve the spraying of a fluid on the aircraft; there may be some noise during this process and, possibly, a slightly unusual smell inside of the cabin. The procedure is routine and should be completed in a few minutes. Thank you for your attention."',
      zh:'「各位貴賓您好，歡迎搭乘，這裡是機長廣播。今天我們必須執行一項除冰程序，以防止機身結冰，預計會在地面停留 {{ph:OO}} 分鐘。{{opt:（若有延誤）}}過程中會在機身噴灑除冰液，可能會有一些聲響，客艙內也可能聞到些微不尋常的氣味。這是例行程序，幾分鐘內即可完成。感謝各位的配合，謝謝。」' },

    missed:{ name:'Missed Approach 重飛', note:'重飛改平至 MA 高度、完成 After Takeoff checklist 後、下一次進場前廣播。',
      en:'"May we have your attention. This is your Captain speaking. We were unable to complete our approach to landing at {{auto:dest_en}}. We have just completed a routine go-around procedure and, shortly, we shall be starting another approach to land. We will be landing in {{ph:OO}} minutes. Thank you for your attention."',
      zh:'「各位貴賓請注意，這裡是機長廣播。我們剛才未能完成在 {{auto:dest_zh}} 的落地進場，已執行一次例行的重飛程序，稍後將重新進場落地，預計在 {{ph:OO}} 分鐘後落地。感謝各位的配合，謝謝。」' },

    divert:{ name:'Diversion 轉降', note:'',
      en:'"May we have your attention. This is your Captain speaking. The weather at {{auto:dest_en}} airport is below landing minimum, we are unable to land at this moment. We shall divert to {{ph:備降場}} airport, and we can wait for the weather at {{auto:dest_en}} airport to improve."',
      zh:'「各位貴賓請注意，這裡是機長廣播。目前 {{auto:dest_zh}} 機場天氣低於落地最低標準，我們暫時無法落地。我們將轉降至 {{ph:備降場}} 機場，等候 {{auto:dest_zh}} 機場天氣好轉。」' },

    cat:{ name:'MOD/SEV CAT 晴空亂流', note:'突發中度／強烈晴空亂流及其他亂流。',
      en:'i. 一般\n"Hello everyone, this is your Captain speaking. We have just encountered an area of {{opt:moderate / severe}} Clear Air Turbulence. The aircraft condition is safe, with all systems operating normally. This type of turbulence cannot be detected with our system and was unexpected. We appreciate your cooperation to stay in your seats with seatbelt fastened until the seatbelt sign is turned off."\n\nii. 若客艙受損或有人受傷\n"The cabin crew are now making every effort to safeguard the condition of everyone onboard. If you need assistance, the crew will help you as soon as possible. We appreciate your cooperation to stay in your seats until the seatbelt sign is turned off. After an assessment of conditions onboard is completed, I will provide you with more information regarding the status of the flight. Your cooperation and understanding are appreciated to ensure the safety of all onboard. Thank you."',
      zh:'i. 一般\n「各位貴賓您好，這裡是機長廣播。我們剛才遭遇一段{{opt:中度／強烈}}晴空亂流。飛機狀況安全，各系統運作正常。這類亂流無法由我們的系統偵測到，屬突發狀況。請各位配合留在座位上並繫好安全帶，直到安全帶指示燈熄滅為止。」\n\nii. 若客艙受損或有人受傷\n「客艙組員正全力確保機上每位旅客的狀況。若您需要協助，組員會盡快提供幫助。請各位配合留在座位上，直到安全帶指示燈熄滅。待完成機上狀況評估後，我會再向各位說明後續航班狀況。感謝各位的配合與諒解，以確保全機安全，謝謝。」' },

    unruly:{ name:'Unruly Pax 滋擾旅客', note:'對滋擾旅客的最終警告（本項附公司官方中文）。',
      en:'"This is your captain speaking. The passenger at {{ph:座位號}}, we have already warned you about your unacceptable behavior and requested you to moderate it. This is the FINAL WARNING that your unruly behavior has violated the above laws and regulations. If the unruly behavior remains, it may be committed a criminal offence, and you may be restrained and handed over to the aviation security authorities. Punishment may be imposed against you, including but not limited to imprisonment, detention or monetary fine. If there is any diversion, stop over or delay caused by your unruly behavior, STARLUX Airlines shall be entitled to request you for any and all losses, expenses and damages incurred from such circumstances. PLEASE NOW COOPERATE WITH OUR CREW MEMBERS IN AN AMICABLE WAY."',
      zh:'「各位女士、各位先生，這裡是機長廣播，我現在鄭重的對座位在 {{ph:座位號}}（及其附近）的乘客提出警告，您現在的行為已經嚴重的違反了中華民國民用航空法。現在請您立即停止滋擾他人及破壞客艙安寧的行為，並依照空服人員的指示配合執行！若因您的行為而造成飛機的延誤、轉降或公司任何損失，公司將依法向您個人提出求償！感謝您們的理解與配合，謝謝！」' },

    bomb:{ name:'Bomb Threat 低調廣播', note:'炸彈威脅之低調廣播（本項附公司官方中文）。',
      en:'"Hello everyone, this is your captain speaking. I would kindly ask everyone to remain seated and stay calm. Our cabin crew will be going through the cabin as part of a routine procedure and may make requests of you during this time. Please cooperate with the crew to the best of your ability. Your cooperation and understanding are greatly appreciated. Thank you."',
      zh:'「各位女士、各位先生，這裡是機長廣播，請各位留在座位上，並保持安靜。我們的空服組員接下來會依照例行程序在客艙內進行檢查，期間可能會請各位配合一些事項。感謝各位的合作與理解，謝謝。」' }
  };
  var ORDER = ['welcome','delay','descent','turb','deice','missed','divert','cat','unruly','bomb'];

  // ---------- 狀態 ---------
  var state = { dest:'', from:'TPE', flt:'', c:'', f:'', tab:'welcome' };

  // ---------- 站表分組 ----------
  var GROUPS = [
    ['日本 UTC+9', ['NRT','KIX','NGO','FUK','CTS','SDJ','HKD','OKA','KMJ','UKB','SHI']],
    ['韓國 UTC+9', ['PUS','ICN']],
    ['台港澳/星馬菲 UTC+8', ['TPE','HKG','MFM','SIN','KUL','CRK','MNL','CEB']],
    ['中南半島/印尼 UTC+7', ['BKK','CNX','SGN','HAN','DAD','PQC','CGK']],
    ['中東 UTC+4', ['AUH']],
    ['歐洲', ['PRG']],
    ['美西', ['SFO','LAX','SEA','ONT','PHX']]
  ];

  function buildStations(){
    var box = $('paStations'); box.innerHTML='';
    GROUPS.forEach(function(g){
      var h = document.createElement('div'); h.className='pa-grp-h'; h.textContent=g[0]; box.appendChild(h);
      g[1].forEach(function(code){
        if(!AP[code]) return;
        var row = document.createElement('div'); row.className='pa-st'; row.dataset.code=code;
        row.innerHTML = '<span class="st-code">'+code+'</span><span class="st-zh">'+AP[code].zh+'</span>'
          + '<span class="st-time" data-t="'+code+'">--:--</span><span class="st-off" data-o="'+code+'"></span>';
        row.addEventListener('click', function(){ state.from='TPE'; setDest(code); $('paFlt').value=''; hideRoute(); });
        box.appendChild(row);
      });
    });
  }
  function tickStations(){
    var now = new Date();
    for(var code in AP){
      var tEl = document.querySelector('#paStations [data-t="'+code+'"]');
      if(!tEl) continue;
      var p = parts(AP[code].tz, now);
      tEl.textContent = p.hour+':'+p.minute;
      var oEl = document.querySelector('#paStations [data-o="'+code+'"]');
      var d = (offsetMin(AP[code].tz, now) - offsetMin('Asia/Taipei', now))/60;
      oEl.textContent = (d===0?'±0':(d>0?'+':'')+ (d%1===0?d.toFixed(0):d.toFixed(1)));
    }
    document.querySelectorAll('#paStations .pa-st').forEach(function(r){
      r.classList.toggle('active', r.dataset.code===state.dest);
    });
  }

  // ---------- 目的地設定 ----------
  function setDest(code){
    state.dest = code;
    updateDestPanel();
    renderAutos();
    document.querySelectorAll('#paStations .pa-st').forEach(function(r){ r.classList.toggle('active', r.dataset.code===code); });
  }
  function updateDestPanel(){
    // 若是班號查詢，updateRoute 會處理；此處僅在手動選時同步下拉
  }

  // ---------- 班號查詢 ----------
  function showRoute(from, to){
    $('paRoute').classList.add('show');
    $('paFrCode').textContent = from; $('paFrZh').textContent = AP[from]?AP[from].zh:'';
    $('paToCode').textContent = to; $('paToZh').textContent = AP[to]?AP[to].zh:'';
    tickDest();
  }
  function hideRoute(){ $('paRoute').classList.remove('show'); }
  function tickDest(){
    var code = $('paToCode').textContent;
    if(!AP[code]) return;
    var p = parts(AP[code].tz);
    var h = parseInt(p.hour,10);
    $('paDestTime').textContent = to12(h)+':'+p.minute+' '+ampm(h);
    $('paDestDate').textContent = WD_ZH[p.weekday]+' '+monEN(p.month)+'/'+p.day;
    $('paDestDiff').textContent = diffText(AP[code].tz, state.from);
  }
  function queryFlt(){
    var v = ($('paFlt').value||'').toUpperCase().replace(/[\s-]/g,'');
    if(!v){ $('paFlt').focus(); return; }
    if(/^\d/.test(v)) v='JX'+v;              // 只打數字自動補 JX
    state.flt = v;
    var to, from;
    if(OUT[v]){ from='TPE'; to=OUT[v]; }
    else if(IN[v]){ from=IN[v]; to='TPE'; }
    else {
      hideRoute();
      $('paToCode').textContent='—';
      alert('查無班號 '+v+'（本表為 2026/07/27–08/02 定期班表；可改用下方「當地時間對照」點選目的地）。');
      return;
    }
    state.from = from;
    showRoute(from, to);
    setDest(to);
  }

  // ---------- 溫度 ----------
  function fmtTemp(n){ return (Math.round(n*10)/10).toString(); }
  $('paC').addEventListener('input', function(){
    var v=parseFloat($('paC').value);
    state.c = $('paC').value;
    if(!isNaN(v)){ state.f = fmtTemp(v*9/5+32); $('paF').value = state.f; } else { state.f=''; $('paF').value=''; }
    renderAutos();
  });
  $('paF').addEventListener('input', function(){
    var v=parseFloat($('paF').value);
    state.f = $('paF').value;
    if(!isNaN(v)){ state.c = fmtTemp((v-32)*5/9); $('paC').value = state.c; } else { state.c=''; $('paC').value=''; }
    renderAutos();
  });

  // ---------- 廣播稿渲染 ----------
  function autoVal(token){
    var code = state.dest;
    var ap = AP[code];
    switch(token){
      case 'flt': return state.flt || '';
      case 'dest_en': return code ? (code + (ap?(' / '+ap.zh):'')) : '';
      case 'dest_zh': return ap ? ap.zh : (code||'');
      case 'temp_c': return state.c || '';
      case 'temp_f': return state.f || '';
      case 'local_en': if(!ap) return ''; { var p=parts(ap.tz); var h=parseInt(p.hour,10); return to12(h)+':'+p.minute+' '+ampm(h); }
      case 'local_zh': if(!ap) return ''; { var q=parts(ap.tz); var hh=parseInt(q.hour,10); var mer=hh<12?'上午':'下午'; return mer+' '+to12(hh)+':'+q.minute; }
      case 'daydate_en': if(!ap) return ''; { var r=parts(ap.tz); return WD_EN[r.weekday]+' '+monEN(r.month)+'/'+r.day; }
      case 'daydate_zh': if(!ap) return ''; { var s=parts(ap.tz); return monEN(s.month)+'/'+s.day+' '+WD_ZH[s.weekday]; }
    }
    return '';
  }
  var AUTO_HINT = {flt:'班號',dest_en:'Destination',dest_zh:'目的地',temp_c:'OO',temp_f:'XX',local_en:'OO:XX',local_zh:'時間',daydate_en:'Day & Date',daydate_zh:'日期'};

  function tokenHTML(seg){
    // seg 形如 "auto:token" / "ph:hint" / "opt:文字"
    var i = seg.indexOf(':'); var kind=seg.slice(0,i), arg=seg.slice(i+1);
    if(kind==='auto'){
      var v = autoVal(arg);
      return '<span class="auto'+(v?'':' empty')+'" data-auto="'+arg+'">'+(v||AUTO_HINT[arg]||'…')+'</span>';
    }
    if(kind==='ph'){ return '<span class="ph" contenteditable="true" data-hint="'+arg+'"></span>'; }
    if(kind==='opt'){ return '<span class="opt">['+arg+']</span>'; }
    return '';
  }
  function renderScript(text){
    var out = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    out = out.replace(/\{\{([^}]+)\}\}/g, function(_,seg){ return tokenHTML(seg); });
    out = out.replace(/\n/g,'<br>');
    return out;
  }
  function renderAutos(){
    // 只更新已在畫面上的 auto 欄位，保留使用者在 ph 打的字
    document.querySelectorAll('#paScriptBox .auto').forEach(function(el){
      var t = el.dataset.auto; var v = autoVal(t);
      el.textContent = v || (AUTO_HINT[t]||'…');
      el.classList.toggle('empty', !v);
    });
    tickDest();
  }

  function buildTabs(){
    var tabs = $('paTabs'); tabs.innerHTML='';
    ORDER.forEach(function(k){
      var b=document.createElement('button'); b.className='pa-tab'+(k===state.tab?' active':''); b.textContent=TPL[k].name; b.dataset.k=k;
      b.addEventListener('click', function(){ state.tab=k; renderTab(); document.querySelectorAll('#paTabs .pa-tab').forEach(function(x){x.classList.toggle('active',x.dataset.k===k);}); });
      tabs.appendChild(b);
    });
  }
  function copyText(el){
    var t = el.innerText.replace(/\s*\[[^\]]*\]\s*/g,' ').replace(/\s+/g,' ').trim();
    if(navigator.clipboard){ navigator.clipboard.writeText(t); }
    return t;
  }
  function renderTab(){
    var k = state.tab, tpl = TPL[k];
    var html = '';
    if(tpl.note) html += '<div class="pa-note">📌 '+tpl.note+'</div>';
    html += '<div class="pa-sech">🅴 English <span class="cp" data-cp="en">複製</span></div>';
    html += '<div class="pa-script en" id="paEn">'+renderScript(tpl.en)+'</div>';
    html += '<div class="pa-sech" style="color:var(--pa-brand)">🇹🇼 中文 <span class="cp" data-cp="zh">複製</span></div>';
    html += '<div class="pa-script zh" id="paZh">'+renderScript(tpl.zh)+'</div>';
    $('paScriptBox').innerHTML = html;
    $('paScriptBox').querySelectorAll('.cp').forEach(function(btn){
      btn.addEventListener('click', function(){
        var box = btn.dataset.cp==='en' ? $('paEn') : $('paZh');
        copyText(box); var old=btn.textContent; btn.textContent='已複製 ✓'; setTimeout(function(){btn.textContent=old;},1200);
      });
    });
  }

  // ---------- 綁定 ----------
  $('paFltBtn').addEventListener('click', queryFlt);
  $('paFlt').addEventListener('keydown', function(e){ if(e.key==='Enter') queryFlt(); });

  // 當地時間對照：預設收合，點標題展開/收合
  $('paStHead').addEventListener('click', function(){
    var box=$('paStations'), sub=$('paStSub'), caret=$('paStCaret');
    var open = box.style.display !== 'none';
    box.style.display = open ? 'none' : 'block';
    sub.style.display = open ? 'none' : 'block';
    caret.textContent = open ? '▸ 展開' : '▾ 收合';
  });

  buildStations();
  buildTabs();
  renderTab();
  tickStations();
  setInterval(function(){ tickStations(); if($('paRoute').classList.contains('show')) tickDest(); }, 15000);
})();
</script>
</body>
</html>
